#
# Installs rEFInd as the bootloader of the installed system.
# Runs chrooted into the mounted target (dontChroot: false):
#   - "Erase disk" mounts the ESP at /boot/efi and the ext4 root at /;
#     the kernel and initramfs live in /boot of the root filesystem
#   - /usr/local/sbin/echoos-refindconf-write (run after refind-install)
#     publishes the loader as the firmware fallback \EFI\BOOT\BOOTX64.EFI
#     and writes a correct /boot/refind_linux.conf derived from the
#     target's fstab; it detects the ESP and kernel locations itself
#   - the refind package files come from the live squashfs base
#   - efibootmgr can write NVRAM entries because Calamares bind-mounts
#     /sys into the target
#
# The actual command logic lives in /usr/local/sbin/echoos-refindconf-write
# (shipped in the live base) rather than inline, because Calamares expands
# ${VAR} inside *script* strings itself against its own environment map and
# fails with "commands use variables that are not defined" when they are
# ordinary shell variables.  Keep every entry below a literal command with
# no dollar expansions.
---
dontChroot: false
timeout: 300
script:
  - "refind-install --alldrivers --yes"
  # chmod first so the job cannot break if the script file ever loses its
  # executable bit in a rebuild; keep every entry a literal command.
  - "chmod +x /usr/local/sbin/echoos-refindconf-write"
  - "/usr/local/sbin/echoos-refindconf-write"
