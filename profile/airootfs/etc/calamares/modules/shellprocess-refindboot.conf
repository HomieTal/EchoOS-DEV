#
# Installs rEFInd as the bootloader of the target system.
# Runs chrooted into the mounted target (dontChroot: false):
#   - the ESP is already mounted at /boot/efi by the mount/fstab modules
#   - the refind package files come from the live squashfs base
#   - efibootmgr can write NVRAM entries because Calamares bind-mounts
#     /sys into the target
# --alldrivers is required because /boot lives inside the ext4 root
# partition, so the ESP needs the ext4 EFI driver to reach the kernel.
---
dontChroot: false
timeout: 300
script:
  - "set -e; refind-install --alldrivers --yes"
