#
# Calamares configuration for the Echo OS live medium.
#
# Installation strategy
# ---------------------
# The target system is populated by the "unpackfs" module, which copies
# the live system's squashfs image (plus the kernel and initramfs that
# live next to it on the ISO) onto the target filesystem.  No package
# download is involved, so a full installation works completely
# offline.  The "packages" module is therefore configured as a no-op
# (see modules/packages.conf); everything the installed system needs is
# already present in the unpacked image.
#
# Branding
# --------
# This configuration deliberately uses the stock "default" Calamares
# branding component.
---
modules-search: [ local ]

# Three instances of the shellprocess module are needed; see the three
# *shellprocess*.conf files.  Every instance in the sequence MUST be
# declared here: an undeclared instance falls back to the module's
# default shellprocess.conf (the upstream example script), which fails.
instances:
  - id: sysusers
    module: shellprocess
    config: shellprocess-sysusers.conf
  - id: refindboot
    module: shellprocess
    config: shellprocess-refindboot.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  # --- partitioning and copying the live system ----------------------
  - partition
  - mount
  - unpackfs
  # The target is a copy of the live system, so its /etc/passwd and
  # /etc/group still contain the live user and none of the standard
  # accounts.  Fix the user database, then drop the live user (this has
  # to happen before "users" so the new account gets uid 1000).
  - shellprocess@sysusers
  - removeuser
  - machineid
  # --- target system configuration -----------------------------------
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - displaymanager
  - hwclock
  - services-systemd
  # No-op with the current configuration, but kept in place so that
  # target-only packages can be added later without touching the
  # sequence (see modules/packages.conf).
  - packages
  # GRUB is not shipped in the ISO (the live medium boots rEFInd and the
  # grub package was dropped), so the stock bootloader module would fail
  # with "grub-install: not found". Install rEFInd into the target's ESP
  # instead (refind is part of the installed base).
  - shellprocess@refindboot
  # --- final clean-up ------------------------------------------------
  - shellprocess@cleanup
  - umount
- show:
  - finished

# Stock Calamares branding; no distribution branding is applied.
branding: default

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
