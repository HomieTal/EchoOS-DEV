# SPDX-License-Identifier: CC0-1.0
#
# Installs the boot loader of the target system.  Runs chrooted into the
# mounted target (dontChroot: false).
#
# UEFI installs
# -------------
#   The ESP is already mounted at /boot by the mount/fstab modules and
#   efibootmgr can write NVRAM entries because Calamares bind-mounts /sys
#   into the target.  rEFInd (0.14.x) cannot read kernels from the ext4
#   root created by modern mkfs.ext4 (orphan_file feature), so
#   --alldrivers is required: /boot lives inside the ext4 root partition
#   and the ESP needs the ext4 EFI driver to reach the kernel.
#
# BIOS installs
# -------------
#   There is no ESP; Calamares' partition module creates an MSDOS table
#   and /boot is a directory on the ext4 root.  The grub package ships in
#   the live image (see components/echo-boot), so the unpacked target has
#   grub-install.  The target disk is derived from the root mount with
#   lsblk -o PKNAME: findmnt alone reports bind mounts as "/dev/sda1[/]"
#   inside the Calamares chroot, which grub-install rejects.
#
# Progress and errors are logged to /var/log/echoos-bootloader.log in the
# target, which survives the installation.
---
dontChroot: false
timeout: 300
script:
  - "set -e; exec > /var/log/echoos-bootloader.log 2>&1; set -x; if [ -d /sys/firmware/efi ]; then refind-install --alldrivers --yes; else rootsrc=$(findmnt -rno SOURCE /); echo \"rootsrc=$rootsrc\"; disk=/dev/$(lsblk -rno PKNAME \"$rootsrc\" | head -1); echo \"disk=$disk\"; test -b \"$disk\"; grub-install --target=i386-pc --boot-directory=/boot --recheck \"$disk\"; grub-mkconfig -o /boot/grub/grub.cfg; fi"
