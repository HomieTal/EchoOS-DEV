#
# Installs the boot loader of the target system.  Runs chrooted into the
# mounted target (dontChroot: false).
#
# The target's boot scheme depends on the firmware the installer booted:
#
# UEFI installs
# -------------
#   The ESP is mounted at /boot (see modules/partition.conf:
#   efiPartitionMountPoint), so the kernel and initramfs are installed
#   directly on the FAT32 ESP:  rEFInd (0.14.x) cannot read kernels
#   from the ext4 root created by modern mkfs.ext4 (orphan_file feature),
#   so the boot files must live on the ESP.  rEFInd is installed with
#   --alldrivers so any foreign ESP can still boot.  efibootmgr can
#   write NVRAM entries because Calamares bind-mounts /sys into the
#   target.
#
# BIOS installs
# -------------
#   There is no ESP; Calamares' partition module creates an MSDOS table
#   and /boot is a directory on the ext4 root.  The grub package ships
#   in the live image (see components/echo-boot), so the unpacked
#   target has grub-install.  The target disk is derived from the root
#   mount: the chroot's / is a bind mount, so its SOURCE may look like
#   "/dev/sda1[/]" and the bracket suffix is stripped before lsblk.
#
# The actual command logic lives in /usr/local/sbin/echoos-refindconf-write
# (shipped in the live base) rather than inline, because Calamares expands
# ${VAR} inside *script* strings itself against its own environment map and
# fails with "commands use variables that are not defined" when they are
# ordinary shell variables.  Keep every entry below a literal command with
# no dollar expansions.
#
# "--bootstrap" is the installer-mode flag: it installs the loader
# binaries as well as the configuration.  Other callers (see the
# echoos-refind-sync.hook in the installed system) must not reinstall
# the loader, only refresh the configuration and runtime files.
#
# Progress and errors are logged to /var/log/echoos-bootloader.log in
# the target, which survives the installation.
---
dontChroot: false
timeout: 900
script:
  # chmod first so the job cannot break if the script file ever loses its
  # executable bit in a rebuild; keep every entry a literal command.
  - "chmod +x /usr/local/sbin/echoos-refindconf-write"
  - "/usr/local/sbin/echoos-refindconf-write --bootstrap"
