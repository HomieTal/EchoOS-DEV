#
# Configure SDDM for the installed system.  The target uses the same Echo OS
# SDDM theme and Wayland session as the live medium, but the live-only
# autologin drop-in is excluded by unpackfs, so the installed system boots to
# the normal login screen.
---
displaymanagers:
  - sddm

basicSetup: false

sysconfigSetup: false

sddm:
  configuration_file: "/etc/sddm.conf"
