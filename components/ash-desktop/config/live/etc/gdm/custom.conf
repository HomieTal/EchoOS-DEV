#
# Echo OS GDM configuration for the live session.
#
# This is the only GDM configuration shipped by ash-desktop; it lives in
# the live overlay and enables autologin for the live user. GDM has no
# conf.d mechanism, so the live overlay carries the whole file. The MAD
# Installer unpackfs exclude list removes /etc/gdm/custom.conf from the
# installed system, so the installed target uses the GDM defaults and
# shows the normal GDM login screen.
#
# GDM's autologin PAM stack (/usr/lib/pam.d/gdm-autologin) only requires
# a valid login shell, so the live user needs no extra group membership.
#
[daemon]
WaylandEnable=true
AutomaticLoginEnable=true
AutomaticLogin=archiso

[security]

[xdmcp]

[chooser]

[debug]
