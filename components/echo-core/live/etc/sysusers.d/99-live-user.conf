#
# Live session user.
#
# /etc/passwd and /etc/shadow already declare "archiso" (uid/gid 1000);
# this file only creates the group of the same name and the "autologin"
# group, and puts the live user into the groups a desktop user needs.
#
# This file must *not* end up in the installed system: it is listed in
# the unpackfs exclude list (see
# /etc/calamares/modules/unpackfs/exclude-list.txt).

# Primary group of the live user (has to match /etc/passwd).
g archiso 1000 - -

# Conventional group for passwordless display-manager login.
g autologin - - -

# Desktop membership for the live session.
m archiso autologin
m archiso wheel
m archiso audio
m archiso video
m archiso storage
m archiso network
m archiso lp
