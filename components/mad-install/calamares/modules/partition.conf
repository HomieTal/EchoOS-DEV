#
# Mount the EFI system partition at /boot so the kernel and initramfs are
# installed on the FAT32 ESP itself. rEFInd (0.14.x) cannot read kernels
# from the ext4 root created by modern mkfs.ext4 (orphan_file feature),
# so the boot files must live on the ESP.
---
efiPartitionMountPoint: "/boot"
