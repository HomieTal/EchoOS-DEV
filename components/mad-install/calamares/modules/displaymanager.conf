#
# Configure LightDM (the default ArchISO XFCE desktop's display manager)
# on the installed system. Autologin is disabled on the target: the
# live-only autologin drop-in (/etc/lightdm/lightdm.conf.d/20-autologin.conf)
# is removed by the unpackfs exclude list, so the installed system shows
# the normal LightDM login screen.
---
displaymanagers:
  - lightdm

basicSetup: false

sysconfigSetup: false
