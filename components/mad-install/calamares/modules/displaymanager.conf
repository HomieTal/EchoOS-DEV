#
# Configure GDM (the Ash Desktop's display manager) on the installed
# system. Autologin is disabled on the target: the live-only
# /etc/gdm/custom.conf is removed by the unpackfs exclude list, so the
# installed system shows the normal GDM login screen.
---
displaymanagers:
  - gdm

basicSetup: false

sysconfigSetup: false
