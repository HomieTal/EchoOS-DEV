#
# Populate the target system's user/group database.
#
# The target is a copy of the live system.  The live system's
# /etc/passwd and /etc/group only contain "root" plus the live user,
# because all other standard accounts are created at boot by
# systemd-sysusers (the *squashfs* that is unpacked into the target is
# built from the package root, not from a running system).
#
# Running systemd-sysusers inside the target chroot creates exactly the
# same set of standard users and groups (root, bin, daemon, sys, adm,
# wheel, audio, video, storage, network, lp, nobody, ...) that a regular
# pacstrap-based installation would have.  It has to run before the
# "users" module, which refuses to continue when the "users" group is
# missing.
---
dontChroot: false
timeout: 120
verbose: true
script:
    - "systemd-sysusers"
