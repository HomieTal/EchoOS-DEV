#
# Locale / timezone selection.
#
# No "geoip" block: the geoip handler would perform a network request to
# geoip.kde.org at start-up, which is undesirable for an offline install.
---
region:                     "America"
zone:                       "New_York"
useSystemTimezone:           true
adjustLiveTimezone:          true
localeGenPath:               "/etc/locale.gen"
