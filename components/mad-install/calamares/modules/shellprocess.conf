#
# Override for the packaged /usr/share/calamares/modules/shellprocess.conf.
#
# The configuration file shipped by the calamares package still contains
# the example job commands from the upstream documentation
# ("touch ${ROOT}/tmp/thingy", "/usr/bin/true" and the hypothetical
# "/usr/local/bin/slowloris").  Calamares loads *both* a plain
# "shellprocess.conf" and every "shellprocess-*.conf" for this module,
# and it searches /etc/calamares/modules before
# /usr/share/calamares/modules, so this empty override replaces the
# packaged example.  The real installation steps live in the
# shellprocess-sysusers.conf, shellprocess-refindboot.conf and
# shellprocess-cleanup.conf files that sit next to this file.
---
script: []
