#
# MAD Installer — applies the keyboard layout chosen on the prototype
# "Set Up Your Keyboard" page (GS key: keyboardLayout, set by welcomeq.qml).
# Runs chrooted after unpackfs; writes X11 + console keyboard config.
# Timezone note: the stock locale view-step is intentionally out of the
# flow; the target keeps the live image's locale and UTC clock.
---
contextualprocess:
    keyboardLayout:
        "*":
            - "printf 'XKBMODEL=pc105\nXKBLAYOUT=us\nXKBVARIANT=\n' > /etc/default/keyboard"
            - "printf 'KEYMAP=us\n' > /etc/vconsole.conf"
        "us":
            - "printf 'XKBMODEL=pc105\nXKBLAYOUT=us\nXKBVARIANT=\n' > /etc/default/keyboard"
            - "printf 'KEYMAP=us\n' > /etc/vconsole.conf"
        "gb":
            - "printf 'XKBMODEL=pc105\nXKBLAYOUT=gb\nXKBVARIANT=\n' > /etc/default/keyboard"
            - "printf 'KEYMAP=uk\n' > /etc/vconsole.conf"
        "de":
            - "printf 'XKBMODEL=pc105\nXKBLAYOUT=de\nXKBVARIANT=\n' > /etc/default/keyboard"
            - "printf 'KEYMAP=de-latin1\n' > /etc/vconsole.conf"
        "fr":
            - "printf 'XKBMODEL=pc105\nXKBLAYOUT=fr\nXKBVARIANT=\n' > /etc/default/keyboard"
            - "printf 'KEYMAP=fr\n' > /etc/vconsole.conf"
        "es":
            - "printf 'XKBMODEL=pc105\nXKBLAYOUT=es\nXKBVARIANT=\n' > /etc/default/keyboard"
            - "printf 'KEYMAP=es\n' > /etc/vconsole.conf"
