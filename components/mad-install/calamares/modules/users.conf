#
# Target system user account.
#
# "users" must already exist in the target system, otherwise the users
# module aborts the installation.  The target is a copy of the live
# system, whose /etc/group only contains "root" (the remaining standard
# groups are created at boot by systemd-sysusers), so the target's
# user/group database is populated by the "shellprocess@sysusers" step
# before this module runs.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - name: lp
      must_exist: false
      system: true
    - name: video
      must_exist: false
      system: true
    - name: network
      must_exist: false
      system: true
    - name: storage
      must_exist: false
      system: true
    - name: audio
      must_exist: false
      system: true

sudoersGroup:    wheel
autologinGroup:  autologin

# Write /etc/sudoers.d/10-installer granting the "wheel" group full sudo.
sudoersConfigureWithGroup: false

# The root account gets the same password as the created user.
setRootPassword: true
doReusePassword: true

# The installed system shows a normal login screen (no autologin).
doAutologin: false
displayAutologin: false

# A password is mandatory: an empty password would leave the target
# account passwordless.
passwordRequirements:
    minLength: 6
    maxLength: -1
    libpwquality:
        - minlen=6
        - minclass=0
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-${product}"
    forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
