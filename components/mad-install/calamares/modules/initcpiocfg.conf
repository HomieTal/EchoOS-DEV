---
# Use host mkinitcpio.conf as template
source: /etc/mkinitcpio.conf
hooks:
    prepend:
        - base
        - udev
    append:
        - autodetect
        - microcode
        - modconf
        - kms
        - keyboard
        - keymap
        - consolefont
        - block
        - filesystems
        - fsck
useSystemdHook: false
be_unsafe: false
