# Echo OS SDDM configuration root file.
#
# SDDM loads /usr/lib/sddm/sddm.conf.d, then /etc/sddm.conf.d/*.conf, and
# finally this file - later files win.  Do NOT put empty [Autologin] keys
# here: they would override the live autologin drop-in and leave the live
# ISO at the greeter.
#
# The file still exists because the Calamares displaymanager module edits
# [Autologin] here for the installed system.  Live-only autologin lives in
# /etc/sddm.conf.d/10-echoos-live-autologin.conf and is excluded from the
# target by the Installer's unpackfs exclude list.
[Theme]
Current=breeze
