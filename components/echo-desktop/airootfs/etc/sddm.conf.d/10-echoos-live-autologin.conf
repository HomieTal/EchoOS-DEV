# Live-session autologin for Echo OS.
#
# The live medium boots straight into Plasma as the unprivileged live user;
# the installed system gets a normal SDDM login screen because this file
# (directory) is on the Calamares unpackfs exclude list.
[Autologin]
User=archiso
Session=plasma.desktop
Relogin=false

[General]
Numlock=on
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
