#
# Echo OS LightDM configuration (common to the live medium and the target).
#
# The live-only autologin drop-in lives in
# /etc/lightdm/lightdm.conf.d/20-autologin.conf and is excluded from the
# installed system by the MAD Installer unpackfs exclude list, so the
# installed system always shows the normal LightDM login screen.
#
# Calamares' displaymanager module is configured to enable this DM.
#
[LightDM]
run-directory=/run/lightdm

[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=xfce
session-wrapper=/etc/lightdm/Xsession

[XDMCPServer]
enabled=false

[VNCServer]
enabled=false
