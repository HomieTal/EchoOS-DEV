# Echo OS — rEFInd boot menu configuration.
#
# Visual identity comes from the Wolfe-derived Echo theme shipped in
# themes/wolfe/ (see themes/wolfe/README.md for provenance and the
# preserved MIT license; release-specific assets live in
# themes/wolfe/release/). The include expands first, so directives
# after it override the theme defaults.

timeout 10
default_selection "Echo OS"

# Manual Echo entries plus automatic discovery of EFI boot loaders on
# all volumes: installed Windows, other EFI operating systems, USB and
# optical media. Legacy BIOS boot stays outside rEFInd by design —
# BIOS boot on the live medium is the Syslinux path.
scanfor manual,internal,external,optical

include themes/wolfe/theme.conf

# Overrides after the include take precedence over the theme file:
# the theme sets "shutdown,reboot"; Echo OS also exposes the firmware
# setup entry (themes/wolfe/icons/func_firmware.png).
showtools shutdown, reboot, firmware

menuentry "Echo OS — Live Environment" {
    loader /arch/boot/x86_64/vmlinuz-linux
    initrd /arch/boot/x86_64/initramfs-linux.img
    options "archisobasedir=arch archisosearchfilename=/arch/version cow_spacesize=10G copytoram=n"
    icon /EFI/BOOT/themes/wolfe/icons/os_echo.png
}

menuentry "Echo OS — Live Environment (Accessibility)" {
    loader /arch/boot/x86_64/vmlinuz-linux
    initrd /arch/boot/x86_64/initramfs-linux.img
    options "archisobasedir=arch archisosearchfilename=/arch/version cow_spacesize=10G copytoram=n accessibility=on"
    icon /EFI/BOOT/themes/wolfe/icons/os_echo.png
}
