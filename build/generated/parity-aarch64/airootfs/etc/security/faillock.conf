#
# Live session only: never lock the live account out.
#
# The default policy locks an account after three failed attempts for
# 15 minutes.  On a live image that is pure annoyance: the session
# would be stuck behind a "N minutes left to unlock" screen with no way
# to recover it.
#
# This file is excluded from the installed system (see
# /etc/calamares/modules/unpackfs/exclude-list.txt), so the target keeps
# the distribution default.
deny = 0
unlock_time = 0
