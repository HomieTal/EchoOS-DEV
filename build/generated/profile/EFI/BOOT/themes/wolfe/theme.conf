# Wolfe rEFInd theme — Echo OS adaptation.
#
# Based on the Wolfe rEFInd theme (MIT, see LICENSE). The only changes
# from the upstream theme.conf are the asset paths: everything lives in
# themes/wolfe/ relative to the rEFInd binary directory (EFI/BOOT),
# and the banner points at the per-release background in release/.
# Release-specific assets (background, accent, artwork, name) are
# documented in release/release.conf.
#
# Directives set here can be overridden by refind.conf directives that
# appear after the include (Echo OS overrides showtools).

# Hide user interface elements to keep the Wolfe look:
# singleuser, hints, arrows, label, badges.
hideui singleuser,hints,arrows,label,badges

# Theme icon directory (relative to the rEFInd binary directory).
# Icons missing here fall back to the default icons/ directory.
icons_dir themes/wolfe/icons

# Release background (per-release asset; see release/release.conf).
banner themes/wolfe/release/background.png

# Scale the banner to fill the screen at any display resolution.
banner_scale fillscreen

# Selection highlight graphics (upstream Wolfe artwork, unmodified).
selection_big   themes/wolfe/selection_big.png
selection_small themes/wolfe/selection_small.png

# Theme default; Echo OS refind.conf re-adds "firmware" after the include.
showtools shutdown,reboot
