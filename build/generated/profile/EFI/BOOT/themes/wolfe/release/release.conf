# Echo OS boot theme — per-release asset manifest.
#
# Only this directory changes between Echo OS animal releases. The
# rEFInd configuration and theme layout (theme.conf, selection graphics,
# icons/) stay identical across releases. To cut a new release:
#
#   1. Replace release/background.png with the new 1920x1080 background
#      (flat accent colour, release name centred at (~960, 356), animal
#      artwork anchored to the bottom-right corner).
#   2. Update the metadata below.
#   3. Leave theme.conf, selection_*.png and icons/ untouched.
#
# Past release asset sets are preserved in git history, not on the ESP.

release_name=Fox
release_date=2026.11
background=background.png
accent_color=#422AAA
wordmark_text=Echo OS
wordmark_color=#E8E8E8
wordmark_shadow=#211360

# artwork_source records where the animal artwork came from for this
# release. The Fox release ships the Wolfe theme's original background
# artwork (background.png) used verbatim — see README.md for the license.
artwork_source=Wolfe theme background.png (verbatim, MIT (c) 2020 Matheus Pratta)
