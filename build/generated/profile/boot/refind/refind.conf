timeout 10
default_selection "Echo OS"
showtools shutdown, reboot, firmware
scanfor manual

menuentry "Echo OS — Live Environment" {
    loader /arch/boot/x86_64/vmlinuz-linux
    initrd /arch/boot/x86_64/initramfs-linux.img
    options "archisobasedir=arch archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=n"
    icon /EFI/BOOT/icons/os_arch.png
}
