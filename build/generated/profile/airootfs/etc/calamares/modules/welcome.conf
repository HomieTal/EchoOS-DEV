#
# Requirements check for the graphical installer.
#
# The "internet" check is deliberately *not* enabled: this ISO must be able
# to perform a full, offline installation. Nothing in the exec sequence
# requires network access (the "packages" module is configured as a no-op and
# the target's package database is refreshed by a shellprocess step whose
# failure is ignored).
#
# All URL buttons (support / known-issues / donate) are disabled: the Echo
# OS branding component carries empty URLs and this ISO has no project
# website.  Showing a KDE donate button on an Arch-based community ISO
# would be misleading.
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    requiredStorage:    8
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - ram
        # MAD Installer: storage is BLOCKING. The inherited config only
        # required `ram`, which let users start an install on a disk smaller
        # than requiredStorage and fail later with rsync error 11 — after
        # the disk had already been partitioned (VM-tested 2026-10-31,
        # testing/screenshots/15-failure-insufficient-disk.png).
        - storage
