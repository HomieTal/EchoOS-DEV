#
# Configuration for the finishedq (QML finished) view step.
---
# Offer the restart checkbox behavior; the MAD finishedq.qml surfaces
# "Restart Now" (config.doRestart) and "Continue Testing" (ViewManager.quit).
restartNowMode: "user-unchecked"
restartNowCommand: "systemctl reboot -i"
