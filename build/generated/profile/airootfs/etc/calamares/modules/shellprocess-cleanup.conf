#
# Final clean-up of the target system.
#
# Every command in this list is prefixed with "-", which means that a
# non-zero exit status is logged but does not abort the installation.
# That is deliberate: the clean-up is best-effort and must never turn a
# successfully installed system into a failed installation.
---
dontChroot: false
timeout: 600
verbose: true
script:
    # Drop the live user's private group, if it is still around.
    - "-groupdel archiso"

    # Remove the graphical installer from the installed system.  "-s"
    # also removes the dependencies that become orphaned because of it
    # (the KDE Frameworks / Qt6 stack that calamares pulls in).
    - "-pacman -Rns --noconfirm calamares"

    # Remove the packages that only exist for the live medium.
    # "-dd" ignores the dependency check: neither package is needed by
    # anything else in the target.
    - "-pacman -Rdd --noconfirm mkinitcpio-archiso livecd-sounds"

    # Replace the live medium's login banner with a generic one.
    - "printf 'Arch Linux\\n' > /etc/motd"

    # Refresh the target's package databases.  The ISO build deletes the
    # pacman sync cache, so the installed system starts with an empty
    # database.  This needs network access and is therefore allowed to
    # fail (the user can run "pacman -Sy" later).
    - "-pacman -Sy --noconfirm"
