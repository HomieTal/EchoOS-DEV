#
# LightDM autologin for the live session.
#
# The live user is a member of the "autologin" group (see
# /etc/sysusers.d/99-live-user.conf), which is what
# /etc/pam.d/lightdm-autologin checks.
#
# This directory is excluded from the installed system (see
# /etc/calamares/modules/unpackfs/exclude-list.txt), so the installed
# system shows a normal login screen.
[Seat:*]
autologin-user=archiso
autologin-session=xfce
