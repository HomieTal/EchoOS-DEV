#
# Echo OS SDDM configuration (common to the live medium and the target).
#
# The live-only autologin drop-in lives in
# /etc/sddm.conf.d/20-echoos-live-autologin.conf and is excluded from the
# installed system by the Calamares unpackfs exclude list.
#
# Calamares' displaymanager module is configured to edit this file.
#
[Autologin]
Relogin=false

[General]
DisplayServer=wayland
HaltCommand=/usr/bin/systemctl poweroff
Numlock=on
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=echoos
CursorTheme=breeze_cursors
Font=DejaVu Sans,10

[Users]
DefaultPath=/usr/local/bin:/usr/bin:/bin
MaximumUid=60513
MinimumUid=1000
RememberLastSession=true
RememberLastUser=true

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
EnableHiDPI=true
SessionCommand=/usr/share/sddm/scripts/wayland-session
SessionDir=/usr/local/share/wayland-sessions,/usr/share/wayland-sessions

[X11]
EnableHiDPI=true
ServerArguments=-nolisten tcp
SessionDir=/usr/local/share/xsessions,/usr/share/xsessions
