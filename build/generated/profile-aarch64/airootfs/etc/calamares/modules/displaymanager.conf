#
# Configure SDDM (Echo Desktop's display manager) on the installed system.
# Autologin is disabled on the target: the live-only autologin drop-in
# (/etc/sddm.conf.d/20-echoos-live-autologin.conf) is removed by the
# unpackfs exclude list, and /etc/sddm.conf exists in the live image so
# this module can edit [Autologin] safely.
---
displaymanagers:
  - sddm

basicSetup: false

sysconfigSetup: false

sddm:
  # The live image ships /etc/sddm.conf for this module to edit.
  configuration_file: "/etc/sddm.conf"
