#
# Remove the live session user from the target system.
#
# The live user ("archiso", uid 1000) is part of the live system's
# /etc/passwd, which is copied verbatim into the target by the unpackfs
# module.  It has to be removed *before* the users module runs, otherwise
# the target account would be created with uid 1001 instead of 1000.
---
username: archiso
