#
# Generate a fresh machine-id for the target system.
#
# The live ISO ships /etc/machine-id with the special value
# "uninitialized"; without this module the target would keep that value
# and only receive a real machine-id on its first boot.
---
systemd: true
"systemd-style": uuid
dbus: true
"dbus-symlink": true
entropy-copy: false
entropy-files:
    - /var/lib/urandom/random-seed
    - /var/lib/systemd/random-seed
